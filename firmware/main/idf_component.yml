## Little World component manifest (pinned to the verified Arcade baseline)
##
## The ESP32-C6 Wi-Fi stack stays OPTIONAL on purpose: the default offline build
## (os-offline) must not depend on it. The hosted packages are declared in
## firmware/idf_component_wifi.yml and are copied into this file only for the
## experimental os-wifi configuration (tools/setup_wifi_components.ps1), because
## declaring them here unconditionally forces every offline build to solve a
## hosted stack it never uses.
dependencies:
  idf: ">=5.5"
  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    version: "==3.0.1"
  lvgl/lvgl:
    version: "==9.5.0"
    public: true
## Little World 鈥?EXPERIMENTAL Wi-Fi manifest overlay
##
## tools/setup_wifi_components.ps1 appends these entries to
## firmware/main/idf_component.yml for the os-wifi configuration only, then
## restores the offline manifest afterwards. Never commit this into the offline
## manifest: the default build must not depend on the ESP32-C6 hosted stack.
##
## Pairing rationale: esp_wifi_remote 1.2.5 is the last 1.2.x that depends on
## esp_hosted 1.4.*, which is the pair the Waveshare 05_wifistation example uses
## on this board (ESP32-P4 + ESP32-C6 over SDIO).
  espressif/esp_wifi_remote:
    version: "==1.2.5"
  espressif/esp_hosted:
    version: "==1.4.*"
